
name: Gerar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar projeto
        run: |
          if [ -f FalaComigo.zip ]; then unzip -oq FalaComigo.zip; fi
          DIR=$(dirname "$(find . -name settings.gradle | head -n1)")
          echo "PROJ=$DIR" >> "$GITHUB_ENV"
      - name: Compilar
        run: gradle -p "$PROJ" assembleDebug --no-daemon
      - name: Renomear APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" FalaComigo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FalaComigo-apk
          path: FalaComigo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FalaComigo v${{ github.run_number }}
          files: FalaComigo.apk
          
